[package]
name = "periodic-arbiter"
version = "0.1.0"
edition = "2021"
description = "周期规则裁决器：带 DST 语义解释的本地周期触发规则引擎与界面"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
chrono-tz = { version = "0.9.0", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "periodic-arbiter"
path = "src/main.rs"

[profile.release]
lto = false
